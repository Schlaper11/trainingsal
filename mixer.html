<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Mischpult – Audio Mixer</title>
  <link rel="stylesheet" href="mixer.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="mixer-header">
    <div class="header-left">
      <a href="index.html" class="back-link">← Training</a>
      <div class="logo">🎛️ Live Mischpult</div>
    </div>
    <div class="header-center">
      <button id="btn-start-audio" class="btn btn-primary">🎙️ Audio starten</button>
      <button id="btn-panic"       class="btn btn-danger">⚠️ Alles Stumm</button>
    </div>
    <div class="header-right">
      <div class="clip-indicator" id="clip-indicator">
        <span class="clip-led" id="clip-led"></span>
        <span>CLIP</span>
      </div>
    </div>
  </header>

  <!-- ===== MIXER CONSOLE ===== -->
  <div class="console-wrap">
    <div class="console" id="console">

      <!-- ─── Channel strips (generated by JS) ─── -->
      <div class="channels" id="channels"></div>

      <!-- ─── Master Section ─── -->
      <div class="master-section">
        <div class="master-label">MASTER</div>

        <div class="master-meters">
          <div class="master-meter-wrap">
            <div class="master-meter-label">L</div>
            <div class="meter-column" id="master-meter-l">
              <!-- LEDs injected by JS -->
            </div>
          </div>
          <div class="master-meter-wrap">
            <div class="master-meter-label">R</div>
            <div class="meter-column" id="master-meter-r">
              <!-- LEDs injected by JS -->
            </div>
          </div>
        </div>

        <div class="master-fader-wrap">
          <div class="fader-track">
            <input type="range" id="master-fader"
                   class="fader-input" orient="vertical"
                   min="0" max="120" step="1" value="100" />
          </div>
          <div class="fader-db-label" id="master-db">0 dB</div>
        </div>

        <div class="master-controls">
          <button class="btn-mute" id="master-mute">MUTE</button>
        </div>
      </div>

    </div><!-- /console -->
  </div><!-- /console-wrap -->

  <!-- ===== INPUT PERMISSION NOTICE ===== -->
  <div id="mic-notice" class="mic-notice hidden">
    🎙️ Mikrofon-Zugriff wurde abgelehnt oder nicht unterstützt. Kanäle nutzen Synthesizer-Töne.
  </div>

  <script src="mixer.js"></script>
</body>
</html>
